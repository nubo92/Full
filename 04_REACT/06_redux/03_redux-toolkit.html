<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@reduxjs/toolkit@1.9.5/dist/redux-toolkit.umd.js"></script>
    <script src="https://unpkg.com/react-redux@8.0.4/dist/react-redux.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        const { Provider, useSelector, useDispatch} = ReactRedux;
        const { createSlice, configureStore} = RTK;     // Redux Toolkit

        // 1. createSlice: 액션 타입, 약션 생성 함수, 리듀서를 한 번에 만든다.
        const counterSlice = createSlice({
            name: 'counter',     // Slicee(리듀서)의 이름(만들어지는 액션 type:'counter/increment')
            initialState: {value: 0},       // 상태 초기값
            reducers: {        // 리듀서 로직
                increment: (state, action) => {
                    // RTK는 내부적으로 Immer 라이브로리를 사용하여
                    // 상태를 직접 수정하는 것처럼 코드를 짜도 불변성을 지켜준다.
                    state.value += action.payload;
                },
                decrement: (state, action) => {
                    state.value -= action.payload;
                }
            }
        });
        console.log(counterSlice);

        // 2. createSlice가 자동으로 만들어준 액션 생성 함수와 리뷰서 꺼내기
        const { increment, decrement} = counterSlice.actions;
        const counterReducer = counterSlice.reducer;

        // 3. configureStore
        const store = configureStore({
            reducer: {
                // 여러 slice를 여기에 등록해서 관리할 수 있다.
                counter: counterReducer
            }
        });

        // 4. React Compnent
        function App() {
            // configureStore에 등록한 키(counter)로 접근한다.
            const count = useSelector(state => state.counter.value);
            const dispatch = useDispatch();

            return (
                <>
                    <h1>Count: {count}</h1>
                    <button onClick={() => dispatch(increment(1))}>+1</button>
                    <button onClick={() => dispatch(decrement(1))}>-1</button>
                </>
            )

        }


        ReactDOM.createRoot(document.getElementById('root')).render(
            <Provider store={store}>
                <App />
            </Provider>
        );

    </script>
</body>
</html>
