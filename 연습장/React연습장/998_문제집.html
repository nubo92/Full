<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        const {useState} = React;

        function Child({name, onChangeName}) {
            return(
                <div>
                    <p>안녕, 나는 {name}야</p>
                    <button onClick={onChangeName}>랜덤 바꾸기</button>    
                </div>
            )
        }

        function Parent() {
            const [name, setName] = useState('');

            const names = ['햄버거', '치킨', '피자', '국수', '빵', '국밥', '샌드위치', '라면']

            const getRandomName = () => {
                let newName;
                do {
                    const randomIndex = Math.floor(Math.random() * names.length);
                    newName = names[randomIndex];
                } while ( newName === name);
                return newName;
            };

            const handleRandomChange = () => {
                setName(getRandomName());
            };

            return (
                <div>
                    <h1>음식 뽑기</h1>
                    <Child name={name} onChangeName={handleRandomChange}/>    
                </div>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Parent />);

    </script>
</body>
</html>
