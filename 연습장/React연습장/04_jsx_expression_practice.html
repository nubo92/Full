<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        const user = '홍판다'; /* 상수 선언*/
        const age = 25;  /* 상수 선언 */
        const now = new Date();
        const greeting = 'React'
        const today = new Date();
        const num1 = 10;
        const num2 = 20;
        const userName = '홍길동';
        
        const element = (
            <div>
                <h1>{user}님, 환영합니다.</h1>
                <p>내년 나이는 {age +1}살 입니다.</p>
                <p>오늘은 {now.toLocaleDateString()}</p>
                <p>{age >= 20 ? '성인입니다' : '미성년자입니다.'}</p>
                <p>이름의 길이는 : {user.length} 글자입니다.</p>
                <p>영문 이름으로 쓰면: {user.toUpperCase()}</p>  {/* 영문일시 대문자로 변환*/}
                <p>오늘의 행운 점수는: {Math.floor(Math.random() * 100)}</p>

                <p>안녕하세요, {greeting} 연습 중입니다.</p>
                <p>현재 시간은 {now.toLocaleTimeString()}</p>
                <p>두 수의 합은 {num1+num2}이고 평균은 {(num1+num2)/2}입니다</p>
                <p>{userName.length >= 3 ? '이름이 꽤 길어요!' : '이름이 짧네요!'}</p>
                
            </div>
        )

        ReactDOM.createRoot(document.getElementById('root')).render(element);

    </script>
</body>
</html>
